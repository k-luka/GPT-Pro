hydra:
  run:
    dir: output/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

eval:
  device: "cuda"
  checkpoint: "output/checkpoints/SFT_retry_1/best.pt"

model:
  vocab_size: 50304
  block_size: 2048
  n_embd: 4096
  n_layers: 27
  n_heads: 32
  head_size: 192
  rope_head_size: 64
  kv_latent_size: 512
  q_latent_size: 4096

  # Must match checkpoint architecture
  n_shared_experts: 2
  n_routed_experts: 40
  topk_experts: 8
  expert_hidden_size: 1024