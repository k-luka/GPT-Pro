hydra:
  run:
    dir: output/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

experiment:
  project: "GPTPro_6p54B_Gemma80K_Pretrain"
  run_name: "gptpro_6p54b_gemma80k_159b"

model:
  vocab_size: 81920
  block_size: 4096
  n_embd: 4096
  n_layers: 35
  n_heads: 32
  n_kv_heads: 8
  ffn_hidden_size: 11008
  tie_embeddings: true

  # Four W512 local layers followed by one full-attention layer.
  sliding_window: 512
  global_attn_every_n: 5
  global_attn_placement: "end"
  local_attn_impl: "fa4"
  global_attn_impl: "sdpa"
  qk_norm_mode: "after"
  sandwich_norm: false
  rope_p: 0.25
  mtp_depth: 0

data:
  tokenizer_path: "tokenizers/gemma4_80k/tokenizer.json"
  train_data_root: "data/climbmix_gemma4_80k/"
  val_data_root: "data/climbmix_gemma4_80k/"

training:
  # Global batch: 4 x 4096 x 32 x 8 = 4,194,304 tokens.
  batch_size: 4
  grad_accum_steps: 32
  fp32_grad_accum: false

  logging_steps: 20
  checkpoint_interval: 3800
  periodic_ckpt_keep_from_frac: 0.667
  generation_interval: 100000

  eval_interval: 3800
  eval_steps: 50
  eval_batch_size: 8
  eval_block_size: 4096
  eval_hellaswag: true
  eval_core: true
  core_max_examples: 1000

  # 38,000 steps = 159.384B tokens; warmdown begins at step 34,200.
  max_steps: 38000
  warmup_steps: 1000
  warmdown_ratio: 0.1
  max_lr: 6.0e-4
  min_lr: 6.0e-5
  weight_decay: 0.1

seed: 1337
