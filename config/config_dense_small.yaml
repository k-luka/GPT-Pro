hydra:
  run:
    dir: output/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

experiment:
  project: "GPT_Max"
  run_name: "dense_3b_mhc"

model:
  vocab_size: 32256        # cl100k_base vocab 100277, padded to multiple of 256
  block_size: 2048
  n_embd: 3072
  n_layers: 28
  n_heads: 24
  n_kv_heads: 8
  ffn_hidden_size: 8192     # ~8/3 * n_embd, rounded to multiple of 256
  mtp_depth: 3              # extra prediction heads (0 = disabled)

data:
  train_data_root: "data/climbmix_400b/"
  val_data_root: "data/climbmix_400b/"

training:
  # ~3B params
  # Short run for throughput + mHC comparison only
  # tokens/step = batch(4) * grad_accum(8) * block(2048) * 4 GPUs = 262,144
  batch_size: 8
  grad_accum_steps: 4

  # Logistics
  logging_steps: 5
  checkpoint_interval: 100000   # effectively disabled for test runs
  generation_interval: 100000
  eval_interval: 100
  eval_steps: 10
  eval_batch_size: 8
  eval_block_size: 2048

  # Optimization
  max_steps: 200
  warmup_steps: 20
  warmdown_ratio: 0.2
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1

# resume_checkpoint: output/checkpoints/dense_small/best_val
