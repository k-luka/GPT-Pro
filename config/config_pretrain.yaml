hydra:
  run:
    dir: output/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

experiment:
  project: "GPT_Pro"
  run_name: "LM_3"

model:
  vocab_size: 151936
  block_size: 2048
  n_embd: 4096
  n_layers: 27
  n_heads: 32
  head_size: 192
  rope_head_size: 64
  kv_latent_size: 512
  q_latent_size: 4096
  
  # MoE Settings
  n_shared_experts: 2
  n_routed_experts: 40
  topk_experts: 8
  expert_hidden_size: 1024

data:
  train_data_root: "data/climbmix_400b/"
  val_data_root: "data/climbmix_400b/"

training:
  batch_size: 16
  grad_accum_steps: 8

  # Logistics
  logging_steps: 1
  checkpoint_interval: 8000
  generation_interval: 10000000
  eval_interval: 400
  eval_steps: 80
  eval_batch_size: 16
  eval_block_size: 2048
  
  # Optimization
  max_steps: 160000
  warmup_steps: 2000
  max_lr: 2.0e-4
  min_lr: 2.0e-5
  weight_decay: 0.1
  
# resume_checkpoint: output/checkpoints/LM_2/best_val