hydra:
  run:
    dir: output/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

experiment:
  project: "GPT_Pro"
  run_name: "PostDeleteTest"

model:
  vocab_size: 50304
  block_size: 2048
  n_embd: 4096
  n_layers: 27
  n_heads: 32
  head_size: 128
  rope_head_size: 64
  kv_latent_size: 512
  q_latent_size: 2048
  
  # MoE Settings
  n_shared_experts: 2
  n_routed_experts: 40
  topk_experts: 6
  expert_hidden_size: 1024

data:
  train_data_root: "data/edu_fineweb350B/"
  val_data_root: "data/edu_fineweb350B/"

training:
  batch_size: 8
  grad_accum_steps: 16

  # Logistics
  logging_steps: 1
  checkpoint_interval: 1000
  generation_interval: 500
  eval_interval: 500
  eval_steps: 20
  eval_batch_size: 4
  eval_block_size: 2048
  
  # Optimization
  max_steps: 10000
  warmup_steps: 1000
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  