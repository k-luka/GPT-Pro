hydra:
  run:
    dir: output/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

experiment:
  project: "GPT_Max"
  run_name: "dense_6p5b"

# ============================================================================
# ~6.5B dense pretraining config — sized for 8x B200 over ~14 days.
#
# SIZING: measured throughput gives 8 GPUs x 14 days ~= 115-135B tokens. At
# 6.5B that's ~18 tok/param (near Chinchilla-optimal); 5.5B would be ~24
# (overtrained, also fine), 7B ~15 (undertrained). 6.5B grows the 5.5B base by
# DEPTH only (30 -> 35 layers), so head_dim/GQA/attention are unchanged.
#
# Param count (vocab 65536, head_dim 128, SwiGLU FFN, weight-tied lm_head):
#   embed (tied)         = 65536 * 4096                      = 268.4M
#   per layer attention  = 2*(4096^2) + 2*(4096*1024)        = 41.9M
#   per layer FFN        = 3 * 4096 * 11008                   = 135.3M
#   per layer total                                          = 177.2M
#   35 layers                                                = 6202.6M
#   TOTAL                                                     ~= 6.47B
#
# Architecture decisions (settled by this week's experiments):
#   - FULL attention (sliding_window/global_attn_every_n = 0). Window attention
#     gave no speed/memory benefit at block_size <= 8k on this stack.
#   - NO MTP (mtp_depth = 0). Training cost not worth it at this scale; only keep
#     it if you later want a speculative-decoding draft head for inference.
#   - Prenorm RMSNorm (sandwich norm slightly hurt val loss).
#   - GQA 32 query / 8 KV heads, RoPE, SwiGLU, MXFP8 (torchao), Muon+AdamW.
#   - WSD-style schedule (warmup -> stable -> warmdown_ratio decay).
# ============================================================================

model:
  vocab_size: 65536         # custom 64k BPE, exact 2^16 (fits uint16)
  block_size: 4096          # 4096 pretrain length (full docs; ~free vs 2048)
  n_embd: 4096
  n_layers: 35
  n_heads: 32               # head_dim = 4096 / 32 = 128
  n_kv_heads: 8             # GQA: 8 KV heads
  ffn_hidden_size: 11008    # SwiGLU, ~8/3 * n_embd, multiple of 256
  # Full attention: both 0 disables locality (all layers global).
  sliding_window: 0
  global_attn_every_n: 0
  # MTP off for training (see header).
  mtp_depth: 0
  mtp_lambda: 0.3
  # p-RoPE (Gemma): rotate only the first 25% of frequency pairs (high-freq,
  # position-carrying); leave the low-freq tail un-rotated for semantics.
  # 1.0 = standard full RoPE.
  rope_p: 0.25
 
data:
  train_data_root: "data/climbmix_400b_64k/"
  val_data_root: "data/climbmix_400b_64k/"

training:
  # 8 GPUs. Effective batch = batch_size * grad_accum * world_size
  #   = 4 * 32 * 8 = 1024 sequences = 1024 * 4096 = ~4.2M tokens/step.
  # Doubled from 512 (ga=16): bigger batch via grad_accum is free on memory and
  # ~+3.5% throughput (fewer optimizer steps). batch_size stays 4 (microbatch is
  # at the ~138 GB memory ceiling; batch>=6 OOMs and >4 gives no speedup -- the
  # 4096-token GEMMs already saturate the B200). DDP replicates state, so per-GPU
  # memory is identical on 8 GPUs.
  batch_size: 4
  grad_accum_steps: 32
  # Accumulate microbatch grads in an fp32 buffer + reduce across ranks in fp32
  # (cast back to bf16 for the optimizer). Matches OLMo's fp32 grad-reduce; guards
  # against bf16 accumulation error at high grad_accum. Costs ~26 GB/GPU.
  fp32_grad_accum: false

  logging_steps: 20
  # Checkpoints are ~35 GB each (weights + Muon/AdamW state). checkpoint_interval
  # is ~one per day (5000 steps ~= 1 day at the measured throughput). Policy
  # (see trainer): through the first ~2/3 only a SINGLE rolling step_* is kept
  # (for requeue/crash resume) + best_val; permanent daily archives accumulate
  # only in the final third (periodic_ckpt_keep_from_frac).
  checkpoint_interval: 5000
  periodic_ckpt_keep_from_frac: 0.667
  generation_interval: 100000
  # Eval every 2500 steps -> ~22 evals (~2/day). Metrics: val loss, val bpb
  # (bits/byte, vocab-invariant), HellaSwag, and a CORE-style MC suite
  # (ARC-Easy/Challenge + OpenBookQA), capped at core_max_examples/task for speed.
  eval_interval: 2500
  eval_steps: 50
  eval_batch_size: 8
  eval_block_size: 4096       # must be <= block_size
  eval_hellaswag: true
  eval_core: true
  core_max_examples: 1000

  # ~6.5B (35 layers). Measured ~31.5k tok/s/GPU (4-GPU probe, ~55% MFU on B200
  # FP8); 8 GPUs ~= 235k tok/s after all-reduce/eval overhead -> ~4800 steps/day.
  # 55k steps @ 4.2M tokens = ~230B tokens (~35 tok/param), finishing in ~11-13
  # days (conservatively under the 14-day wall, so the WSD decay completes even
  # if throughput is lower than probed).
  max_steps: 55000
  warmup_steps: 1000
  warmdown_ratio: 0.2         # WSD: decay LR over the final 20% of steps
  # From the LR sweep at the 4.2M-token batch (lr_sweep_6p5b_4p2m): 6e-4 won a
  # clean U-shape (3e-4 / 6e-4 / 1.2e-3 -> 4.07 / 3.86 / 4.22 val). Robust across
  # both 2.1M and 4.2M batches (Muon match_rms damps batch->LR sensitivity).
  max_lr: 6.0e-4
  min_lr: 6.0e-5
  weight_decay: 0.1

# resume_checkpoint: output/checkpoints/dense_6p5b/step_XXXXX
