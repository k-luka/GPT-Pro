hydra:
  run:
    dir: output/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

experiment:
  project: "GPT_Max"
  run_name: "GatorLM2_nano"

model:
  vocab_size: 100352        # cl100k_base vocab 100277, padded to multiple of 256
  block_size: 1024
  n_embd: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 4
  ffn_hidden_size: 1280     # ~8/3 * n_embd, rounded to multiple of 256

data:
  train_data_root: "data/climbmix_400b/"
  val_data_root: "data/climbmix_400b/"

training:
  # ~50M params
  # Chinchilla-optimal: 20 tok/param -> ~1B tokens -> ~4,000 steps
  # tokens/step = batch(8) * grad_accum(4) * block(1024) * world(4 GPUs) = 131,072
  # But run longer for pretraining quality testing (10x Chinchilla = 40,000 steps)
  batch_size: 8
  grad_accum_steps: 4

  # Logistics
  logging_steps: 20
  checkpoint_interval: 5000
  generation_interval: 10000000
  eval_interval: 200
  eval_steps: 40
  eval_batch_size: 16
  eval_block_size: 1024

  # Optimization
  max_steps: 40000
  warmup_steps: 200
  warmdown_ratio: 0.2   # last 20% of training: linear decay from max_lr to min_lr
  max_lr: 6.0e-4
  min_lr: 6.0e-5
  weight_decay: 0.1

# resume_checkpoint: output/checkpoints/GatorLM2_nano/best_val
