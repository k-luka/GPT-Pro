hydra:
  run:
    dir: output/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}

experiment:
  project: "GPT_Pro_SFT"
  run_name: "SFT_retry_1"

model:
  vocab_size: 50304
  block_size: 2048
  n_embd: 4096
  n_layers: 27
  n_heads: 32
  head_size: 192
  rope_head_size: 64
  kv_latent_size: 512
  q_latent_size: 4096

  # MoE settings (must match pretrained checkpoint architecture)
  n_shared_experts: 2
  n_routed_experts: 40
  topk_experts: 8
  expert_hidden_size: 1024

data:
  train_file: "data/sft_data/sft_train.pt"
  val_file: "data/sft_data/sft_val.pt"

training:
  batch_size: 4
  grad_accum_steps: 4
  max_steps: 5000
  warmup_steps: 100
  max_lr: 5.0e-5
  min_lr: 5.0e-6
  weight_decay: 0.01
  grad_clip: 1.0

  # Logging and evaluation cadence
  logging_steps: 10
  eval_interval: 100
  eval_steps: 20
  eval_batch_size: 4
  checkpoint_interval: 500

  device: "cuda"

resume_checkpoint: "output/checkpoints/LM_2/best_val"
